<!DOCTYPE html>
<html>
<head>
    <title>Simple Image Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .test-image {
            max-width: 100%;
            border: 2px solid #ddd;
            margin: 10px 0;
            padding: 5px;
        }
        .log {
            border: 1px solid #eee;
            padding: 10px;
            margin: 10px 0;
            background: #f9f9f9;
            max-height: 200px;
            overflow-y: auto;
        }
        button {
            padding: 8px 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <h1>Simple Image Test</h1>
    
    <p>Image ID: <input type="text" id="imageId" value="img-1741986583817" style="width: 250px;"></p>
    
    <div>
        <button onclick="loadImage('api')">Load from /api/content-image/</button>
        <button onclick="loadImage('direct')">Load from /direct-image/</button>
        <button onclick="loadImage('debug')">Load from /debug-image/</button>
    </div>
    
    <div id="imageContainer" style="margin-top: 20px;">
        <!-- Image will be inserted here -->
    </div>
    
    <h3>Console Log:</h3>
    <div id="log" class="log"></div>
    
    <script>
        function log(message) {
            console.log(message);
            const logElement = document.getElementById('log');
            const entry = document.createElement('div');
            entry.textContent = message;
            logElement.appendChild(entry);
            logElement.scrollTop = logElement.scrollHeight;
        }
        
        function loadImage(type) {
            const imageId = document.getElementById('imageId').value.trim();
            if (!imageId) {
                log("Please enter an image ID");
                return;
            }
            
            log(`Loading image ${imageId} using ${type} route...`);
            
            const imageContainer = document.getElementById('imageContainer');
            imageContainer.innerHTML = '';
            
            const img = document.createElement('img');
            img.className = 'test-image';
            img.alt = 'Test Image';
            
            switch(type) {
                case 'api':
                    img.src = `/api/content-image/${imageId}`;
                    break;
                case 'direct':
                    img.src = `/direct-image/${imageId}`;
                    break;
                case 'debug':
                    img.src = `/debug-image/${imageId}`;
                    break;
            }
            
            img.onload = function() {
                log(`Image loaded successfully using ${type} route!`);
            };
            
            img.onerror = function() {
                log(`Failed to load image using ${type} route`);
                img.style.height = '100px';
                img.style.display = 'flex';
                img.style.alignItems = 'center';
                img.style.justifyContent = 'center';
                img.style.border = '1px dashed red';
                img.style.background = '#ffeeee';
                img.alt = 'Failed to load image';
            };
            
            imageContainer.appendChild(img);
        }
    </script>
</body>
</html>
