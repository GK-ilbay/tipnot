services:
  - type: web
    name: tipnot-v2
    env: node
    buildCommand: npm run install-all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
    # Add this if you need to serve the frontend from the backend
    staticPublishPath: ./tipnot-frontend/build 